<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Uncanny Garden</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      color: #fff;
    }

    #canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    #camera-feed {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* ── Landing ── */
    #landing {
      position: fixed;
      inset: 0;
      z-index: 10;
      cursor: pointer;
      transition: opacity 0.8s ease;
    }
    #landing.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Title — between loading label and center text, shifted right for uncanny asymmetry */
    #landing-title {
      position: absolute;
      top: 24%;
      left: 57%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: clamp(1.4rem, 5vw, 2.8rem);
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    /* Loading counter — tiny, top-right */
    #loading-label {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 0.48rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0.28;
    }

    /* Direction text centered in the screen */
    #landing-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    #landing-desc {
      font-size: clamp(1.05rem, 3.8vw, 1.4rem);
      font-weight: 800;
      letter-spacing: 0.06em;
      opacity: 0.88;
      text-align: center;
      line-height: 2.2;
      min-height: 5em;
    }

    /* Blinking cursor for typing effect */
    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: #fff;
      vertical-align: text-bottom;
      margin-left: 2px;
      animation: blink 0.75s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    #landing-credits {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-size: 0.52rem;
      letter-spacing: 0.12em;
      opacity: 0.25;
      line-height: 1.9;
      white-space: nowrap;
    }

    /* ── HUD ── */
    #hud {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      display: none;
    }

    /* Center element prompt */
    #element-prompt {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      transition: opacity 0.5s ease;
    }
    #element-prompt.hidden {
      opacity: 0;
    }

    #prompt-element {
      display: block;
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    #prompt-gesture {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.45;
    }

    /* Palm ring */
    #palm-ring {
      position: absolute;
      width: 80px;
      height: 80px;
      transform: translate(-50%, -50%);
      display: none;
      pointer-events: none;
    }

    #palm-ring svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    #palm-ring circle.track {
      fill: none;
      stroke: rgba(255,255,255,0.15);
      stroke-width: 3;
    }

    #palm-ring circle.progress {
      fill: none;
      stroke: #fff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 220;
      stroke-dashoffset: 220;
      transition: stroke-dashoffset 0.05s linear;
    }

    /* Status */
    #status {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      opacity: 0.4;
    }
  </style>
</head>
<body>

  <video id="camera-feed" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>

  <!-- Landing -->
  <div id="landing">
    <h1 id="landing-title">Uncanny Garden</h1>
    <p id="loading-label">loading 0 / 5</p>
    <div id="landing-center">
      <p id="landing-desc"></p>
    </div>
    <div id="landing-credits">
      <div>Randi Matushevitz &nbsp;Techspressionist</div>
      <div>Bin Youn &nbsp;AR</div>
      <div>Gustavo Guzmán &nbsp;Sound</div>
      <div>2026</div>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div id="status"></div>

    <div id="element-prompt">
      <span id="prompt-element"></span>
      <span id="prompt-gesture"></span>
    </div>

    <div id="palm-ring">
      <svg viewBox="0 0 80 80">
        <circle class="track"    cx="40" cy="40" r="35" />
        <circle class="progress" cx="40" cy="40" r="35" />
      </svg>
    </div>
  </div>

  <script>
    // Typing effect for landing description
    const LINES = [
      'Your Hand Gestures',
      'Bloom Five Elemental',
      'Flowergirls with Limelight.',
    ]
    const CHAR_DELAY = 65   // ms per character
    const LINE_PAUSE = 320  // extra pause between lines

    function startTyping() {
      const el     = document.getElementById('landing-desc')
      const cursor = document.createElement('span')
      cursor.className = 'typing-cursor'
      el.innerHTML = ''
      el.appendChild(cursor)

      let lineIdx = 0, charIdx = 0

      function typeNext() {
        if (lineIdx >= LINES.length) {
          // done — cursor keeps blinking
          return
        }
        const line = LINES[lineIdx]
        if (charIdx < line.length) {
          cursor.insertAdjacentText('beforebegin', line[charIdx])
          charIdx++
          setTimeout(typeNext, CHAR_DELAY)
        } else {
          // end of line
          lineIdx++
          charIdx = 0
          if (lineIdx < LINES.length) {
            cursor.insertAdjacentHTML('beforebegin', '<br>')
            setTimeout(typeNext, LINE_PAUSE)
          }
        }
      }

      setTimeout(typeNext, 600)
    }

    window.addEventListener('DOMContentLoaded', startTyping)
  </script>

  <script type="module" src="/src/main.js"></script>
</body>
</html>

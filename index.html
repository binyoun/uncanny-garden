<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Uncanny Garden</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Josefin+Sans:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      color: #fff;
    }

    #canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      touch-action: none;   /* prevent browser pinch-zoom from hijacking the gesture */
    }

    #camera-feed {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* ── Landing ── */
    #landing {
      position: fixed;
      inset: 0;
      z-index: 10;
      cursor: pointer;
      transition: opacity 0.8s ease;
    }
    #landing.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Title — between loading label and center text */
    #landing-title {
      position: absolute;
      top: 19%;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(2.18rem, 7.8vw, 4.37rem);
      font-weight: 400;
      letter-spacing: 0.028em;
    }
    #landing-title .tc {
      font-size: 1.2em;
      letter-spacing: 0.022em;
    }

    /* Loading counter — tiny, top-right */
    #loading-label {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 0.48rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0.28;
    }

    /* Direction text centered in the screen */
    #landing-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    #landing-desc {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.05rem, 3.8vw, 1.4rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      opacity: 0.88;
      text-align: center;
      line-height: 2.4;
      min-height: 5em;
    }

    /* Blinking cursor for typing effect */
    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: #fff;
      vertical-align: text-bottom;
      margin-left: 2px;
      animation: blink 0.75s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* Gesture text pulses after typing until hand is detected */
    @keyframes gesture-pulse {
      0%, 100% { opacity: 0.7; }
      50%       { opacity: 0.15; }
    }
    .gesture-waiting {
      animation: gesture-pulse 1.3s ease-in-out infinite;
    }

    #landing-credits {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.4rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.55;
    }

    .credits-names {
      display: flex;
      gap: 2.8rem;
      justify-content: center;
      margin-bottom: 0.6rem;
    }

    .credit-person {
      text-align: center;
      line-height: 1.26;
    }

    .credits-year {
      text-align: center;
      letter-spacing: 0.25em;
    }

    /* ── HUD ── */
    #hud {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      display: none;
    }

    /* Center element prompt */
    #element-prompt {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      transition: opacity 0.5s ease;
    }
    #element-prompt.hidden {
      opacity: 0;
    }

    #prompt-element {
      display: block;
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    #prompt-gesture {
      display: block;
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.35rem, 4.75vw, 1.96rem);
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.7;
    }

    /* Palm ring */
    #palm-ring {
      position: absolute;
      width: 80px;
      height: 80px;
      transform: translate(-50%, -50%);
      display: none;
      pointer-events: none;
    }

    #palm-ring svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    #palm-ring circle.track {
      fill: none;
      stroke: rgba(255,255,255,0.15);
      stroke-width: 3;
    }

    #palm-ring circle.progress {
      fill: none;
      stroke: #fff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 220;
      stroke-dashoffset: 220;
      transition: stroke-dashoffset 0.05s linear;
    }

    /* Status */
    #status {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      opacity: 0.4;
    }
  </style>
</head>
<body>

  <video id="camera-feed" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>

  <!-- Landing -->
  <div id="landing">
    <h1 id="landing-title"><span class="tc">U</span>ncanny <span class="tc">G</span>arden</h1>
    <p id="loading-label">loading 0 / 5</p>
    <div id="landing-center">
      <p id="landing-desc"></p>
    </div>
    <div id="landing-credits">
      <div class="credits-names">
        <div class="credit-person">
          <div>Randi</div>
          <div>Matushevitz</div>
          <div>Techspressionist</div>
        </div>
        <div class="credit-person">
          <div>Bin</div>
          <div>Youn</div>
          <div>AR</div>
        </div>
        <div class="credit-person">
          <div>Gustavo</div>
          <div>Guzmán</div>
          <div>Sound</div>
        </div>
      </div>
      <div class="credits-year">2026</div>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div id="status"></div>

    <div id="element-prompt">
      <span id="prompt-element"></span>
      <span id="prompt-gesture"></span>
    </div>

    <div id="palm-ring">
      <svg viewBox="0 0 80 80">
        <circle class="track"    cx="40" cy="40" r="35" />
        <circle class="progress" cx="40" cy="40" r="35" />
      </svg>
    </div>
  </div>

  <script>
    // Typing effect for landing description
    const LINES = [
      'Your Hand Gestures',
      'Bloom Five Elemental',
      'Flowergirls.',
    ]
    const CHAR_DELAY = 65   // ms per character
    const LINE_PAUSE = 320  // extra pause between lines

    function startTyping() {
      const el     = document.getElementById('landing-desc')
      const cursor = document.createElement('span')
      cursor.className = 'typing-cursor'
      el.innerHTML = ''
      el.appendChild(cursor)

      let lineIdx = 0, charIdx = 0

      function typeNext() {
        if (lineIdx >= LINES.length) {
          // done — cursor keeps blinking
          return
        }
        const line = LINES[lineIdx]
        if (charIdx < line.length) {
          cursor.insertAdjacentText('beforebegin', line[charIdx])
          charIdx++
          setTimeout(typeNext, CHAR_DELAY)
        } else {
          // end of line
          lineIdx++
          charIdx = 0
          if (lineIdx < LINES.length) {
            cursor.insertAdjacentHTML('beforebegin', '<br>')
            setTimeout(typeNext, LINE_PAUSE)
          }
        }
      }

      setTimeout(typeNext, 600)
    }

    window.addEventListener('DOMContentLoaded', startTyping)
  </script>

  <script type="module" src="/src/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Uncanny Garden</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      color: #fff;
    }

    #canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    #camera-feed {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* ── Landing ── */
    #landing {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      cursor: pointer;
      transition: opacity 0.8s ease;
    }
    #landing.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #landing-title {
      font-size: clamp(2.2rem, 8vw, 4rem);
      font-weight: 200;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    #landing-desc {
      font-size: clamp(0.85rem, 2.8vw, 1.1rem);
      letter-spacing: 0.05em;
      opacity: 0.75;
      max-width: 300px;
      text-align: center;
      line-height: 1.9;
    }

    #loading-label {
      font-size: 0.72rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      opacity: 0.4;
    }

    #landing-credits {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-size: 0.52rem;
      letter-spacing: 0.12em;
      opacity: 0.25;
      line-height: 1.9;
      white-space: nowrap;
    }

    /* ── HUD ── */
    #hud {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      display: none;
    }

    /* Center element prompt */
    #element-prompt {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      transition: opacity 0.5s ease;
    }
    #element-prompt.hidden {
      opacity: 0;
    }

    #prompt-element {
      display: block;
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    #prompt-gesture {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.45;
    }

    /* Palm ring */
    #palm-ring {
      position: absolute;
      width: 80px;
      height: 80px;
      transform: translate(-50%, -50%);
      display: none;
      pointer-events: none;
    }

    #palm-ring svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    #palm-ring circle.track {
      fill: none;
      stroke: rgba(255,255,255,0.15);
      stroke-width: 3;
    }

    #palm-ring circle.progress {
      fill: none;
      stroke: #fff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 220;
      stroke-dashoffset: 220;
      transition: stroke-dashoffset 0.05s linear;
    }

    /* Status */
    #status {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      opacity: 0.4;
    }
  </style>
</head>
<body>

  <video id="camera-feed" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>

  <!-- Landing -->
  <div id="landing">
    <h1 id="landing-title">Uncanny Garden</h1>
    <p id="landing-desc">This garden needs your hand gesture to bloom 5 elemental flowers.</p>
    <p id="loading-label">tap to begin</p>
    <div id="landing-credits">
      <div>Randi Matushevitz &nbsp;Techspressionist</div>
      <div>Bin Youn &nbsp;AR</div>
      <div>Gustavo Guzmán &nbsp;Sound</div>
      <div>2026</div>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div id="status"></div>

    <div id="element-prompt">
      <span id="prompt-element"></span>
      <span id="prompt-gesture"></span>
    </div>

    <div id="palm-ring">
      <svg viewBox="0 0 80 80">
        <circle class="track"    cx="40" cy="40" r="35" />
        <circle class="progress" cx="40" cy="40" r="35" />
      </svg>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
